<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>France — Échauffement</title>
<meta name="theme-color" content="#14181e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Échauffement">
<link rel="preload" href="fonts/archivo-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="index.html">← Départs</a>
    <h1>Départements et régions</h1>
  </header>

  <section id="setup">
    <p class="intro">Les 96 départements et les 13 régions de métropole. Tu peux taper le nom ou le numéro d'un département (31, 2A…).</p>
    <div class="tabs" id="modetabs" role="group" aria-label="Mode de jeu"></div>
    <p class="muted small" id="modehelp" style="max-width:70ch;margin:4px 0 0"></p>
    <div class="choices" id="choices"></div>
  </section>

  <section id="game" class="hidden">
    <div class="hud">
      <input id="guess" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Ta réponse">
      <div class="ask hidden" id="asking"><span class="q">Où est</span><b id="askname"></b><span class="n" id="asknum"></span><button class="btn" id="skip">Je ne sais pas</button></div>
      <div class="stat" id="timer"><small>Temps</small>--:--</div>
      <div class="stat" id="score"><small>Trouvés</small>0/0</div>
      <div class="stat rec" id="best"><small>Record</small>—</div>
      <label class="toggle" title="Zoomer automatiquement sur chaque bonne réponse"><input type="checkbox" id="follow"> Suivre</label>
      <button class="btn danger" id="giveup">J'abandonne</button>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <p class="last" id="last" aria-live="polite"></p>
    <div class="mapbox">
      <svg id="map" role="img" aria-label="Carte"></svg>
      <div class="zoombtns"><button id="zin" aria-label="Zoomer">+</button><button id="zout" aria-label="Dézoomer">−</button><button id="zreset" aria-label="Recentrer">⟲</button></div>
      <div class="hint">Molette ou pincement pour zoomer, glisser pour déplacer</div>
      <div class="tip" id="tip"></div>
    </div>
    <div class="foundbox" id="foundbox"><h3 id="foundtitle">Trouvés</h3><div class="fchips" id="foundlist"></div></div>
    <div id="results" class="results hidden"></div>
  </section>
</div>
<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="js/common.js"></script>
<script>const MAPSET = "france";</script>
<script src="js/pays.js"></script>
</body>
</html>
