<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Géopolitique — Échauffement</title>
<meta name="theme-color" content="#14181e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Échauffement">
<link rel="preload" href="fonts/archivo-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="index.html">← Départs</a>
    <h1>Géopolitique</h1>
  </header>

  <section id="setup">
    <p class="intro">Organisations internationales, routes stratégiques, conflits, économie mondiale. Après chaque réponse, une phrase explique <b>pourquoi c'est important</b>.</p>
    <div class="choices" id="modes"></div>
    <div id="stats"></div>
  </section>

  <section id="quiz" class="hidden">
    <div class="hud">
      <div class="stat" id="qnum"><small>Question</small>1</div>
      <div class="stat" id="qscore"><small>Bonnes</small>0</div>
      <div class="stat" id="qtimer"><small>Temps</small>--:--</div>
      <button class="btn danger" id="stop" style="margin-left:auto">Terminer</button>
    </div>
    <div class="bar"><i id="qprog"></i></div>
    <div class="qcard">
      <span class="tag" id="qtheme"></span>
      <p class="qtext" id="qtext"></p>
      <div class="opts" id="opts"></div>
      <div class="expl hidden" id="expl" aria-live="polite"></div>
      <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn primary hidden" id="next">Question suivante</button></div>
    </div>
    <p class="muted small">Clavier : touches 1 à 4 pour répondre, Entrée pour continuer.</p>
  </section>

  <section id="end" class="hidden"></section>
</div>
<script src="js/common.js"></script>
<script src="js/questions-geo.js"></script>
<script>
const CFG = { bank: "geo", pass: null, modes: [
  { key: "flash", label: "Flash", sub: "10 questions, 5 min", n: 10, time: 300 },
  { key: "session", label: "Session", sub: "20 questions, 10 min", n: 20, time: 600 }
]};
</script>
<script src="js/quiz.js"></script>
</body>
</html>
